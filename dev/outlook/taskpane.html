      <h5 class="view-title text-center" data-key="PRIVATE_KEY_TITLE"></h5>

      <div class="d-flex gap-2 mb-3">
        <button
          id="createKeyOpenBtn"
          class="btn btn-outline-primary w-50"
          data-key="CREATE_KEY_BUTTON"
        ></button>
        <button
          id="verifyKeyOpenBtn"
          class="btn btn-primary w-50"
          data-key="VERIFY_KEY_BUTTON"
        ></button>
      </div>

      <!-- 重要通知 modal -->
      <div
        id="createKeyWarningModal"
        class="modal"
        tabindex="-1"
        style="display: none"
        aria-modal="true"
        role="dialog"
      >
        <div class="modal-dialog modal-sm">
          <div class="modal-content">
            <div class="modal-header">
              <h6 class="modal-title" data-key="NOTICE_TITLE"></h6>
            </div>
            <div class="modal-body small" data-key="CREATE_KEY_REPLACE_WARNING"></div>
            <div class="modal-footer">
              <button
                id="createKeyWarningCancel"
                class="btn btn-sm btn-outline-secondary"
                data-key="ERROR_BACK_BUTTON"
              ></button>
              <button
                id="createKeyWarningConfirm"
                class="btn btn-sm btn-primary"
                data-key="CONTINUE_BUTTON"
              ></button>
            </div>
          </div>
        </div>
      </div>

      <!-- 建立私鑰 inline -->
      <div id="createKeyInline" style="display: none" class="mt-3">
        <!-- submit 之上內容保留等高，使建立 CTA 與較高的驗證 CTA 落同一 Y -->
        <div class="key-inline-reserve">
          <div class="input-group mb-2">
            <input
              type="password"
              id="createKeyPwdInput"
              class="form-control"
              placeholder=""
              data-placeholder-key="PRIVATE_KEY_PASSWORD_PLACEHOLDER"
            />
            <button type="button" id="createKeyPwdToggle" class="btn btn-password-toggle">
              <i id="createKeyPwdIcon" class="bi bi-eye-slash"></i>
            </button>
          </div>
          <p class="small text-muted mb-2" data-key="KEY_PWD_HINT_12CHARS"></p>
        </div>
        <button
          id="createKeySubmitBtn"
          class="btn btn-primary w-100"
          data-key="CREATE_KEY_BUTTON"
        ></button>
      </div>

      <!-- 驗證私鑰 inline -->
      <div id="verifyKeyInline" style="display: none" class="mt-3">
        <!-- submit 之上內容保留等高，使驗證 CTA 與建立 CTA 落同一 Y -->
        <div class="key-inline-reserve">
          <!-- 自製檔案選擇器：隱藏原生 input + 整框可點 + 檔名顯示 -->
          <div class="field-box field-box--clickable mb-2" id="vaultFileChooseBox">
            <input type="file" id="vaultFileInput" class="d-none" accept=".json,application/json" />
            <span class="field-box__seg" data-key="FILE_PICKER_CHOOSE"></span>
            <span class="field-box__content">
              <span id="vaultFileName" class="text-truncate" data-key="FILE_PICKER_NONE"></span>
            </span>
          </div>
          <div class="input-group mb-2">
            <input
              type="password"
              id="verifyKeyPwdInput"
              class="form-control"
              placeholder=""
              data-placeholder-key="PRIVATE_KEY_PASSWORD_PLACEHOLDER"
            />
            <button type="button" id="verifyKeyPwdToggle" class="btn btn-password-toggle">
              <i id="verifyKeyPwdIcon" class="bi bi-eye-slash"></i>
            </button>
          </div>
        </div>
        <button
          id="verifyKeySubmitBtn"
          class="btn btn-primary w-100"
          data-key="VERIFY_KEY_BUTTON"
        ></button>
      </div>
    </div>

    <!-- Main View -->
    <div id="mainView" class="view" data-view="mainView">
      <button
        id="mainBackBtn"
        class="btn btn-sm corner-btn corner-btn-left"
        data-key="ERROR_BACK_BUTTON"
      ></button>
      <button
        id="logoutBtn"
        class="btn btn-sm corner-btn corner-btn-right"
        data-key="LOGOUT_BUTTON"
      ></button>
      <button
        id="refreshBtn"
        class="btn btn-sm corner-btn corner-btn-right-stacked"
        data-key="REFRESH_BUTTON"

      <h5 class="view-title text-center" data-key="MAIN_TITLE"></h5>
      <div class="cta-reserve">
        <!-- 收件人：左標籤片段 + 輸入，與下方檔案選擇器同構造、左段等寬 X 切齊 -->
        <div class="field-box mb-2">
          <span class="field-box__seg" data-key="RECIPIENT_LABEL"></span>
          <span class="field-box__content">
            <input type="text" id="recipientInput" class="field-box__input" />
          </span>
        </div>
        <!-- 自製檔案選擇器：隱藏原生 input + 整框可點 + 檔名顯示 -->
        <div class="field-box field-box--clickable" id="fileChooseBox">
          <input type="file" id="fileInput" class="d-none" />
          <span class="field-box__seg" data-key="FILE_PICKER_CHOOSE"></span>
          <span class="field-box__content">
            <span id="fileName" class="text-truncate" data-key="FILE_PICKER_NONE"></span>
          </span>
        </div>
      </div>
      <button id="uploadBtn" class="btn btn-primary w-100 mb-2" data-key="UPLOAD_BUTTON"></button>
      <div id="uploadStatus" class="small text-break"></div>
    </div>

    <!-- Loading View -->
    <div id="loadingView" class="view" data-view="loadingView">
      <div
        class="d-flex flex-column align-items-center justify-content-center"
        style="min-height: 200px"
      >
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden" data-key="LOADING_TEXT"></span>
        </div>
        <p class="mt-2" data-key="PROCESSING_TEXT"></p>
      </div>
    </div>

    <!-- Error View -->
    <div id="errorView" class="view" data-view="errorView">
      <div class="alert alert-danger" data-key="ERROR_MESSAGE"></div>
      <button
        id="errorBackBtn"
        class="btn btn-outline-secondary w-100"
        data-key="ERROR_BACK_BUTTON"
      ></button>
    </div>

    <!-- Success View -->
    <div id="successView" class="view text-center p-3" data-view="successView">
      <div class="text-success mb-2">
        <i class="bi bi-check-circle-fill" style="font-size: 2rem"></i>
      </div>
      <h5 class="mb-2" data-key="SUCCESS_TITLE"></h5>
      <p class="text-muted mb-3" data-key="SUCCESS_MESSAGE"></p>
      <button
        type="button"
        id="successBackBtn"
        class="btn btn-primary w-100"
        data-key="BACK_TO_MAIN"
      ></button>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>

  </body>
